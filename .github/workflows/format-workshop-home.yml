name: Format workshop home (temporary)

on:
  push:
    branches:
      - redesign/workshop-home-identity
    paths:
      - src/routes/dashboard.tsx
      - .github/workflows/format-workshop-home.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out redesign branch
        uses: actions/checkout@v4
        with:
          ref: redesign/workshop-home-identity
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format only the Workshop home route
        run: npx prettier --write src/routes/dashboard.tsx
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "Workshop home is already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/dashboard.tsx
          git commit -m "style: format Forge workshop home"
          git push origin HEAD:refs/heads/redesign/workshop-home-identity
