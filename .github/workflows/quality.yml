name: Forge quality checks

on:
  push:
    branches:
      - main
      - fix/guided-build-focused-task-slots
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: forge-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guided-build-tests:
    name: Guided Build regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test -- src/lib/learning-engine/__tests__/learning-engine-and-verification.test.ts

  full-tests:
    name: Full test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test

  production-build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
