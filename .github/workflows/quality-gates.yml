name: Forge quality gates

on:
  push:
    branches:
      - main
      - fix/guided-build-explicit-task-slots
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guided-build-tests:
    name: Guided Build contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Test Guided Build contracts
        run: npx vitest run src/lib/learning-engine/__tests__/learning-engine-and-verification.test.ts

  production-build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build production app
        run: npm run build

  focused-lint:
    name: Lint focused task editor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Lint focused editor
        run: npx eslint src/components/projects/guided-task-slot-editor.tsx

  format-redesign-files:
    name: Format redesign files and export result
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the pull request branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Format only files changed by this redesign
        run: npx prettier --write 'src/components/atelier/atelier-top-nav.tsx' 'src/components/atelier/builders-pinboard.tsx' 'src/components/atelier/learning-path-folios.tsx' 'src/components/atelier/studio-desk-hero.tsx' 'src/components/atelier/unfolded-blueprint-trail.tsx' 'src/routes/dashboard.tsx'

      - name: Commit formatting changes to the pull request branch
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'src/components/atelier/atelier-top-nav.tsx' 'src/components/atelier/builders-pinboard.tsx' 'src/components/atelier/learning-path-folios.tsx' 'src/components/atelier/studio-desk-hero.tsx' 'src/components/atelier/unfolded-blueprint-trail.tsx' 'src/routes/dashboard.tsx'
          if git diff --cached --quiet; then
            echo "No formatting changes to commit."
          else
            git commit -m "style: format redesign files"
            git push origin "HEAD:refs/heads/$PR_BRANCH"
          fi
      - name: Export formatted files
        uses: actions/upload-artifact@v4
        with:
          name: forge-pr32-formatted-files
          if-no-files-found: error
          path: |
            src/components/atelier/atelier-top-nav.tsx
            src/components/atelier/builders-pinboard.tsx
            src/components/atelier/learning-path-folios.tsx
            src/components/atelier/studio-desk-hero.tsx
            src/components/atelier/unfolded-blueprint-trail.tsx
            src/routes/dashboard.tsx
  full-lint-baseline:
    name: Full repository lint (known baseline)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Run full repository lint
        run: npm run lint

  full-regression:
    name: Full test suite (known repository baseline)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Run full test suite
        run: npm test
